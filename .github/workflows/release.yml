name: Release

# Push a tag "vX.Y.Z" to build the Windows installer and publish it as a GitHub release.
# Installed apps find the new version there and update themselves (Velopack).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/WorkspaceManager.App -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Previous release (for delta packages)
        continue-on-error: true
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack --packId WorkspaceManager --packVersion ${{ env.VERSION }} --packDir publish
          --mainExe WorkspaceManager.exe --packTitle "Workspace Manager" --packAuthors nhatminhit1703
          --icon src/WorkspaceManager.App/Assets/app.ico

      - name: Upload to GitHub release
        run: >
          vpk upload github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }}
          --publish --releaseName "Workspace Manager ${{ env.VERSION }}" --tag v${{ env.VERSION }}
